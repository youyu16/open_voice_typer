name: OpenVoiceTyper
options:
  bundleIdPrefix: com.shuaiwang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  OpenVoiceTyper:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/OpenVoiceTyper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shuaiwang.openvoicetyper
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Open Voice Typer
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Open Voice Typer records audio during a dictation session to transcribe your speech.
        NSSpeechRecognitionUsageDescription: Used for on-device speech recognition when Apple ASR is selected.
        # A self-hosted transcription server (whisper.cpp, Speaches, LM Studio)
        # is plain HTTP on the LAN, which ATS blocks and iOS gates behind the
        # local-network prompt. Cleartext stays limited to local networking —
        # provider endpoints on the internet are still HTTPS-only.
        NSLocalNetworkUsageDescription: Lets you point speech-to-text or polish at a transcription server running on your own network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.shuaiwang.openvoicetyper
            CFBundleURLSchemes:
              - openvoicetyper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuaiwang.openvoicetyper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VoiceKeyboard
        embed: true

  VoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    entitlements:
      path: Keyboard/VoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shuaiwang.openvoicetyper
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Voice Typer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuaiwang.openvoicetyper.keyboard

  OpenVoiceTyperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: OpenVoiceTyper

  OpenVoiceTyperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: OpenVoiceTyper
    dependencies:
      - target: OpenVoiceTyper

schemes:
  OpenVoiceTyper:
    build:
      targets:
        OpenVoiceTyper: all
    run:
      config: Debug
    test:
      targets:
        - OpenVoiceTyperTests
        - OpenVoiceTyperUITests
